<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="description" content="Yashwanth Hub — Local-first founder command center, tasks, calendar, documents, and 90-day execution" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yashwanth Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yashwanth Hub" />
    <meta property="og:title" content="Yashwanth Hub — Command Center" />
    <meta property="og:description" content="A local-first AI chief of staff: tasks, calendar, projects and grounded AI planning in one calm workspace." />
    <meta property="og:url" content="https://yashwanth-hub.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yashwanth Hub — Command Center" />
    <meta name="twitter:description" content="A local-first AI chief of staff: tasks, calendar, projects and grounded AI planning in one calm workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without blocking first paint; system fonts show until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
    <title>Yashwanth Hub — Command Center</title>
    <script>
      // Apply the theme before first paint (no flash). Dark is the default; "light" and
      // "system" are explicit choices made in Settings or the header toggle.
      (function () {
        try {
          var saved = localStorage.getItem('yash_theme');
          var dark = saved === 'light' ? false : saved === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
