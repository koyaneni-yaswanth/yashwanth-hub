    <meta name="description" content="Yashwanth Hub — Local-first founder command center, tasks, calendar, documents, and 90-day execution" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:description" content="A local-first AI chief of staff: tasks, calendar, projects and grounded AI planning in one calm workspace." />
    <meta property="og:url" content="https://yashwanth-hub.vercel.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Yashwanth Hub — Command Center</title>
    <script>
      // Apply the saved/system theme before first paint so dark-mode users never see a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('yash_theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-hub-bg text-hub-ink antialiased selection:bg-teal-500/20 selection:text-teal-900 dark:selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
